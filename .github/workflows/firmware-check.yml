name: Firmware Check

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-check.yml"
  pull_request:
    paths:
      - "firmware/**"

jobs:
  validate-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify primary sketch exists
        run: test -f firmware/mpu6050_init/mpu6050_init.ino
