name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  frontend-artifact:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: neuropulse-frontend-dist
          path: frontend/dist

  backend-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar -czf neuropulse-backend.tar.gz backend
      - uses: actions/upload-artifact@v4
        with:
          name: neuropulse-backend
          path: neuropulse-backend.tar.gz
